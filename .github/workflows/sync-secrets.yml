
# 将 GitHub Secrets 同步到 Cloudflare Worker
# 触发: push 到 main 或手动运行

name: Sync secrets to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for name in ADMIN_PASSWORD SESSION_SECRET CF_ACCOUNT_ID D1_DATABASE_ID D1_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "::warning::$name 在 GitHub Secrets 中为空，已跳过"
              continue
            fi
            printf '%s' "$val" | npx -y wrangler secret put "$name" --name gordondrop
            echo "✓ $name 已同步"
          done
